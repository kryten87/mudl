name: Release

# Builds and publishes a .deb whenever a `v#.#.#` tag is pushed. Pinned to
# ubuntu-22.04 for the same reason as ci.yml: mudl's actual target platform,
# and per docs/PACKAGING.md, release artifacts must be built on the same
# Ubuntu release they're shipped for so `$auto` dependency resolution
# matches the target's package names (e.g. the 24.04+ `t64` rename).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    name: Build .deb and publish release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: cargo build --release
        run: cargo build --release

      - name: cargo deb
        run: cargo deb -p mudl-cli

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: target/debian/*.deb
          generate_release_notes: true
